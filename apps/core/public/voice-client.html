<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="theme-color" content="#14120e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>Dost</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; --bg: #14120e; --surface: #1d1a15; --border: #3c3428; --text: #f3ecdf; --muted: #c8bba6; --dim: #6d5e49; --accent: #e7d7bf; --accent-fg: #1b160f; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { height: 100%; overflow: hidden; }
      body { background: var(--bg); color: var(--text); height: 100%; display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; }

      /* ── Header (pinned) ── */
      header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 0.75rem 1.25rem; text-align: center; background: var(--bg); border-bottom: 1px solid var(--border); }
      header h1 { font-weight: 600; letter-spacing: -0.03em; font-size: 1.4rem; }
      header p { color: var(--muted); font-size: 0.78rem; margin-top: 0.1rem; }
      .header-spacer { flex-shrink: 0; height: 3.6rem; }

      /* ── Mode toggle button (top-right) ── */
      .mode-bar { position: absolute; top: 0.65rem; right: 1rem; display: flex; gap: 0.25rem; }
      .mode-btn { height: 34px; padding: 0 0.7rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; font: inherit; font-size: 0.75rem; display: flex; align-items: center; gap: 0.35rem; transition: background 0.2s, border-color 0.2s, color 0.2s; }
      .mode-btn:hover { border-color: var(--dim); background: #252017; }
      .mode-btn:active { transform: scale(0.95); }
      .mode-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
      .mode-btn svg { width: 16px; height: 16px; fill: currentColor; }

      /* ── Main area ── */
      main { flex: 1; display: flex; flex-direction: column; max-width: 42rem; width: 100%; margin: 0 auto; overflow: hidden; }

      /* ── Text mode ── */
      #textView { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
      #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6rem; padding: 0.75rem 1.25rem; overscroll-behavior: contain; }
      .bubble { padding: 0.75rem 1rem; border-radius: 1.1rem; line-height: 1.5; white-space: pre-wrap; max-width: 85%; animation: fadeIn 0.15s ease; font-size: 0.95rem; }
      .user { background: #2a241c; align-self: flex-end; border-bottom-right-radius: 0.35rem; }
      .assistant { background: #1f2a24; align-self: flex-start; border-bottom-left-radius: 0.35rem; }
      .thinking-bubble { align-self: flex-start; padding: 0.75rem 1.2rem; background: #1f2a24; border-radius: 1.1rem; border-bottom-left-radius: 0.35rem; animation: fadeIn 0.15s ease; display: flex; gap: 0.35rem; align-items: center; }
      .thinking-bubble .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s ease-in-out infinite; }
      .thinking-bubble .dot:nth-child(2) { animation-delay: 0.15s; }
      .thinking-bubble .dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

      .text-input-row { flex-shrink: 0; display: flex; gap: 0.5rem; padding: 0.75rem 1.25rem; padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--bg); }
      .text-input-row input { flex: 1; padding: 0.7rem 1rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: inherit; font: inherit; font-size: 1rem; outline: none; }
      .text-input-row input:focus { border-color: var(--dim); }
      .text-input-row button { flex-shrink: 0; border: 0; border-radius: 999px; width: 42px; height: 42px; background: var(--accent); color: var(--accent-fg); cursor: pointer; display: flex; align-items: center; justify-content: center; }
      .text-input-row button:disabled { opacity: 0.35; cursor: not-allowed; }
      .text-input-row button svg { width: 20px; height: 20px; fill: currentColor; }

      /* ── Voice mode ── */
      .voice-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem; padding-bottom: env(safe-area-inset-bottom); }
      .orb-container { position: relative; width: 150px; height: 150px; }
      .orb { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 38% 38%, #3a3028, #1d1a15); border: 2px solid var(--border); cursor: pointer; transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s; }
      .orb:hover { transform: scale(1.04); }

      .voice-area.listening .orb { border-color: #d7a15e; box-shadow: 0 0 30px rgba(215,161,94,0.25), 0 0 60px rgba(215,161,94,0.1); animation: pulse 1.5s ease-in-out infinite; }
      .voice-area.thinking .orb { border-color: #8b7355; box-shadow: 0 0 20px rgba(139,115,85,0.2); animation: spin-glow 2s linear infinite; }
      .voice-area.speaking .orb { border-color: #6abf8a; box-shadow: 0 0 30px rgba(106,191,138,0.25), 0 0 60px rgba(106,191,138,0.1); animation: speak-pulse 0.8s ease-in-out infinite; }

      .voice-label { font-size: 0.95rem; color: var(--muted); min-height: 1.4rem; text-align: center; }
      .voice-hint { font-size: 0.78rem; color: var(--dim); text-align: center; min-height: 1.2rem; transition: opacity 0.2s; }

      /* ── Status ── */
      #status { flex-shrink: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.72rem; color: var(--dim); text-align: center; padding: 0.35rem 1rem; min-height: 1.4rem; }

      /* ── Camera mode ── */
      #cameraView { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
      .camera-preview-container { position: relative; flex-shrink: 0; background: #0a0a0a; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; max-height: 50vh; overflow: hidden; }
      .camera-preview-container video { width: 100%; max-height: 50vh; object-fit: cover; display: block; }
      .camera-flip-btn { position: absolute; top: 0.6rem; right: 0.6rem; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.45); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); transition: background 0.2s; z-index: 2; }
      .camera-flip-btn:hover { background: rgba(0,0,0,0.65); }
      .camera-flip-btn:active { transform: scale(0.9); }
      .camera-flip-btn svg { width: 20px; height: 20px; fill: currentColor; }
      .camera-error { padding: 2rem 1.25rem; text-align: center; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
      .camera-error .camera-error-icon { font-size: 2rem; margin-bottom: 0.5rem; display: block; }
      #cameraLog { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6rem; padding: 0.75rem 1.25rem; overscroll-behavior: contain; }

      .hidden { display: none !important; }

      @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes speak-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      @keyframes spin-glow { 0% { box-shadow: 0 0 20px rgba(139,115,85,0.3); } 50% { box-shadow: 0 0 35px rgba(139,115,85,0.15); } 100% { box-shadow: 0 0 20px rgba(139,115,85,0.3); } }
    </style>
  </head>
  <body>
    <header>
      <h1>Dost</h1>
      <p>Your personal AI assistant</p>
      <!-- Mode bar: Text | Voice | Camera -->
      <div class="mode-bar">
        <button class="mode-btn active" data-mode="text" aria-label="Text mode">
          <svg viewBox="0 0 24 24"><path d="M3 5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H3Zm0 2h18v10H3V7Zm2 2v2h2V9H5Zm4 0v2h2V9H9Zm4 0v2h2V9h-2Zm4 0v2h2V9h-2ZM5 13v2h2v-2H5Zm4 0v2h6v-2H9Zm8 0v2h2v-2h-2Z"/></svg>
        </button>
        <button class="mode-btn" data-mode="voice" aria-label="Voice mode">
          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm-1-9a1 1 0 1 1 2 0v6a1 1 0 1 1-2 0V5Zm6 6a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V20H8v2h8v-2h-3v-2.07A7 7 0 0 0 19 11h-2Z"/></svg>
        </button>
        <button class="mode-btn" data-mode="camera" aria-label="Camera mode">
          <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4ZM9 2l-1.83 2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.17L15 2H9Zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg>
        </button>
      </div>
    </header>
    <div class="header-spacer"></div>

    <main>
      <!-- Text mode -->
      <div id="textView">
        <div id="log"></div>
        <div class="text-input-row">
          <input id="textInput" placeholder="Type a message…" autocomplete="off" />
          <button id="sendText" type="button" aria-label="Send">
            <svg viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>

      <!-- Voice mode -->
      <div id="voiceView" class="voice-area hidden">
        <div class="orb-container">
          <div class="orb" id="orb"></div>
        </div>
        <div class="voice-label" id="voiceLabel">Tap to speak</div>
        <div class="voice-hint" id="voiceHint"></div>
      </div>

      <!-- Camera mode -->
      <div id="cameraView" class="hidden">
        <div class="camera-preview-container">
          <video id="cameraPreview" autoplay playsinline muted></video>
          <button id="cameraFlip" class="camera-flip-btn" type="button" aria-label="Switch camera">
            <svg viewBox="0 0 24 24"><path d="M20 5h-3.17L15 3H9L7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm-8 13a5.5 5.5 0 0 1 0-11v2.5L15.5 6 12 2.5V5a7 7 0 1 0 7 7h-2.5A4.5 4.5 0 0 1 12 16.5Z"/></svg>
          </button>
          <div id="cameraError" class="camera-error hidden"></div>
        </div>
        <div id="cameraLog"></div>
        <div class="text-input-row">
          <input id="cameraInput" placeholder="Ask something about this…" autocomplete="off" />
          <button id="sendCamera" type="button" aria-label="Send">
            <svg viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </main>

    <div id="status"></div>

    <script>
      const textView = document.querySelector("#textView");
      const voiceView = document.querySelector("#voiceView");
      const cameraView = document.querySelector("#cameraView");
      const modeBtns = document.querySelectorAll(".mode-btn");
      const textInput = document.querySelector("#textInput");
      const sendTextBtn = document.querySelector("#sendText");
      const logEl = document.querySelector("#log");
      const statusEl = document.querySelector("#status");
      const orb = document.querySelector("#orb");
      const voiceLabel = document.querySelector("#voiceLabel");
      const voiceHint = document.querySelector("#voiceHint");
      const cameraPreview = document.querySelector("#cameraPreview");
      const cameraFlipBtn = document.querySelector("#cameraFlip");
      const cameraErrorEl = document.querySelector("#cameraError");
      const cameraLogEl = document.querySelector("#cameraLog");
      const cameraInput = document.querySelector("#cameraInput");
      const sendCameraBtn = document.querySelector("#sendCamera");

      function generateId() {
        if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID().slice(0, 8);
        return Math.random().toString(36).slice(2, 10);
      }
      const conversationId = "dost-" + generateId();
      let mode = "text";
      let socket = null;
      let recording = false;
      let audioContext = null;
      let processor = null;
      let mediaStream = null;
      let assistantEl = null;
      let acceptAudio = true;

      let playing = false;
      let currentAudio = null;
      const audioQueue = [];
      const pendingChunks = [];
      let totalPendingBytes = 0;
      let responseDone = false;
      const PLAY_THRESHOLD = 128000;

      let cameraStream = null;
      let cameraAnalyzing = false;
      let cameraFacingMode = "environment";
      const CAMERA_MAX_DIMENSION = 1280;
      const CAMERA_JPEG_QUALITY = 0.85;

      // ─── PWA ───

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }

      // ─── Keep layout pinned when mobile keyboard opens ───

      if (window.visualViewport) {
        const onVPResize = () => {
          const vv = window.visualViewport;
          document.body.style.height = vv.height + "px";
          window.scrollTo(0, 0);
        };
        window.visualViewport.addEventListener("resize", onVPResize);
        window.visualViewport.addEventListener("scroll", () => window.scrollTo(0, 0));
      }

      // ─── Mode switching ───

      modeBtns.forEach((btn) => btn.addEventListener("click", () => switchMode(btn.dataset.mode)));

      function switchMode(newMode) {
        if (mode === newMode) return;
        const prevMode = mode;
        mode = newMode;

        modeBtns.forEach((btn) => btn.classList.toggle("active", btn.dataset.mode === mode));
        textView.classList.toggle("hidden", mode !== "text");
        voiceView.classList.toggle("hidden", mode !== "voice");
        cameraView.classList.toggle("hidden", mode !== "camera");

        if (prevMode === "voice") {
          stopMic();
          stopPlayback();
          if (socket) { socket.close(); socket = null; }
          setVoiceState("idle");
        }
        if (prevMode === "camera") {
          closeCamera();
        }

        if (mode === "voice") {
          connectWebSocket();
        } else if (mode === "text") {
          textInput.focus();
        } else if (mode === "camera") {
          openCamera();
        }
      }

      // ─── WebSocket ───

      function connectWebSocket() {
        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
        const protocol = location.protocol === "https:" ? "wss" : "ws";
        socket = new WebSocket(protocol + "://" + location.host + "/ws/voice");
        socket.binaryType = "arraybuffer";
        socket.addEventListener("open", () => {
          socket.send(JSON.stringify({ type: "session.start", conversationId }));
          setStatus("connecting");
        });
        socket.addEventListener("close", () => {
          socket = null;
          if (mode === "voice") {
            setVoiceState("idle");
            voiceHint.textContent = "Disconnected. Tap to reconnect.";
            stopMic();
          }
        });
        socket.addEventListener("message", (event) => {
          if (typeof event.data !== "string") return;
          onServerEvent(JSON.parse(event.data));
        });
      }

      // ─── Server events ───

      function onServerEvent(msg) {
        if (msg.type === "session.ready") {
          setStatus("");
          setVoiceState("idle");
          voiceHint.textContent = "";
        }
        if (msg.type === "transcript.partial") {
          if (mode === "text") { /* text mode doesn't use partials */ }
        }
        if (msg.type === "transcript.final") {
          acceptAudio = true;
          if (mode === "text") showUser(msg.text);
        }
        if (msg.type === "agent.status") {
          if (mode === "voice") setVoiceState(msg.status === "thinking" ? "thinking" : "idle");
          if (mode === "text" && msg.status === "thinking") showThinking();
        }
        if (msg.type === "tool.call") {
          if (mode === "text") setStatus("tool: " + msg.name);
        }
        if (msg.type === "response.text.delta") {
          if (mode === "voice") setVoiceState("speaking");
          if (mode === "text") { removeThinking(); appendAssistant(msg.text); }
        }
        if (msg.type === "response.audio.delta" && acceptAudio) {
          bufferAudio(msg.audio, msg.contentType);
        }
        if (msg.type === "response.done") {
          responseDone = true;
          flushAudioQueue();
          if (mode === "text") { removeThinking(); setStatus(""); }
          if (mode === "voice") {
            if (!playing) setVoiceState("idle");
            voiceLabel.textContent = "Tap to speak";
          }
        }
        if (msg.type === "error") {
          removeThinking();
          setStatus(msg.code + ": " + msg.message);
          if (mode === "voice") setVoiceState("idle");
        }
      }

      // ─── Voice state & orb ───

      function setVoiceState(state) {
        voiceView.classList.remove("listening", "thinking", "speaking");
        if (state === "listening") {
          voiceView.classList.add("listening");
          voiceLabel.textContent = "Listening\u2026";
          voiceHint.textContent = "Tap again when you\u2019re done speaking";
        } else if (state === "thinking") {
          voiceView.classList.add("thinking");
          voiceLabel.textContent = "Thinking\u2026";
          voiceHint.textContent = "";
        } else if (state === "speaking") {
          voiceView.classList.add("speaking");
          voiceLabel.textContent = "Speaking\u2026";
          voiceHint.textContent = "";
        } else {
          voiceLabel.textContent = "Tap to speak";
          voiceHint.textContent = "";
        }
      }

      // ─── Orb tap → toggle mic ───

      orb.addEventListener("click", async () => {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          connectWebSocket();
          return;
        }
        if (recording) stopMic();
        else await startMic();
      });

      // ─── Text mode ───

      textInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !sendTextBtn.disabled) sendTextMessage();
      });
      sendTextBtn.addEventListener("click", sendTextMessage);

      async function sendTextMessage() {
        const text = textInput.value.trim();
        if (!text) return;
        textInput.value = "";
        showUser(text);
        showThinking();
        sendTextBtn.disabled = true;
        textInput.disabled = true;
        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ conversationId, message: text }),
          });
          const data = await response.json();
          removeThinking();
          if (!response.ok) {
            setStatus((data.error?.code || "error") + ": " + (data.error?.message || response.statusText));
          } else {
            appendAssistant(data.message);
          }
        } catch (err) {
          removeThinking();
          setStatus("error: " + err.message);
        } finally {
          sendTextBtn.disabled = false;
          textInput.disabled = false;
          textInput.focus();
        }
      }

      // ─── Chat log ───

      function showUser(text) {
        document.querySelector("#partial")?.remove();
        const el = document.createElement("div");
        el.className = "bubble user";
        el.textContent = text;
        logEl.append(el);
        assistantEl = null;
        logEl.scrollTop = logEl.scrollHeight;
      }

      function appendAssistant(text) {
        if (!assistantEl) {
          assistantEl = document.createElement("div");
          assistantEl.className = "bubble assistant";
          logEl.append(assistantEl);
        }
        assistantEl.textContent += text;
        logEl.scrollTop = logEl.scrollHeight;
      }

      function showThinking() {
        removeThinking();
        const el = document.createElement("div");
        el.className = "thinking-bubble";
        el.id = "thinkingIndicator";
        el.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
        logEl.append(el);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function removeThinking() {
        document.querySelector("#thinkingIndicator")?.remove();
      }

      function setStatus(text) { statusEl.textContent = text; }

      // ─── Microphone ───

      async function startMic() {
        if (!window.isSecureContext) {
          setStatus("Microphone requires HTTPS or localhost");
          return;
        }
        acceptAudio = false;
        stopPlayback();
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
        audioContext = new AudioContext();
        const inputRate = audioContext.sampleRate;
        const source = audioContext.createMediaStreamSource(mediaStream);
        processor = audioContext.createScriptProcessor(4096, 1, 1);
        const mute = audioContext.createGain();
        mute.gain.value = 0;
        processor.onaudioprocess = (event) => {
          if (!recording || !socket || socket.readyState !== WebSocket.OPEN) return;
          const pcm = floatTo16(downsample(event.inputBuffer.getChannelData(0), inputRate, 16000));
          socket.send(pcm.buffer);
        };
        source.connect(processor);
        processor.connect(mute);
        mute.connect(audioContext.destination);
        socket.send(JSON.stringify({ type: "audio.start", sampleRate: 16000, channels: 1 }));
        recording = true;
        setVoiceState("listening");
      }

      function stopMic() {
        if (!recording && !mediaStream) return;
        recording = false;
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: "audio.stop" }));
        }
        processor?.disconnect();
        processor = null;
        mediaStream?.getTracks().forEach((track) => track.stop());
        mediaStream = null;
        void audioContext?.close();
        audioContext = null;
      }

      function downsample(input, inRate, outRate) {
        if (inRate === outRate) return input;
        const ratio = inRate / outRate;
        const length = Math.floor(input.length / ratio);
        const result = new Float32Array(length);
        for (let i = 0; i < length; i += 1) result[i] = input[Math.floor(i * ratio)];
        return result;
      }

      function floatTo16(input) {
        const out = new Int16Array(input.length);
        for (let i = 0; i < input.length; i += 1) {
          const sample = Math.max(-1, Math.min(1, input[i]));
          out[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
        }
        return out;
      }

      // ─── Audio playback (length-based buffering) ───

      function bufferAudio(b64, contentType) {
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        pendingChunks.push({ bytes, type: contentType || "audio/mpeg" });
        totalPendingBytes += bytes.length;
        if (totalPendingBytes >= PLAY_THRESHOLD) flushAudioQueue();
      }

      function flushAudioQueue() {
        if (pendingChunks.length === 0) return;
        const allBytes = pendingChunks.reduce((acc, c) => {
          const merged = new Uint8Array(acc.length + c.bytes.length);
          merged.set(acc); merged.set(c.bytes, acc.length);
          return merged;
        }, new Uint8Array(0));
        const type = pendingChunks[0].type;
        pendingChunks.length = 0;
        totalPendingBytes = 0;
        audioQueue.push(URL.createObjectURL(new Blob([allBytes], { type })));
        void playNext();
      }

      async function playNext() {
        if (playing || audioQueue.length === 0) return;
        playing = true;
        if (mode === "voice") setVoiceState("speaking");
        const url = audioQueue.shift();
        currentAudio = new Audio(url);
        currentAudio.onended = () => {
          URL.revokeObjectURL(url);
          playing = false;
          currentAudio = null;
          if (audioQueue.length > 0) { void playNext(); return; }
          if (responseDone && mode === "voice") setVoiceState("idle");
        };
        currentAudio.onerror = () => {
          URL.revokeObjectURL(url);
          playing = false;
          currentAudio = null;
          void playNext();
        };
        try { await currentAudio.play(); } catch { playing = false; currentAudio = null; void playNext(); }
      }

      function stopPlayback() {
        pendingChunks.length = 0;
        totalPendingBytes = 0;
        responseDone = false;
        audioQueue.splice(0).forEach((url) => URL.revokeObjectURL(url));
        currentAudio?.pause();
        currentAudio = null;
        playing = false;
      }

      // ─── Camera ───

      async function openCamera() {
        cameraErrorEl.classList.add("hidden");
        cameraPreview.classList.remove("hidden");
        cameraFlipBtn.classList.remove("hidden");
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showCameraError("Your browser does not support camera access.");
          return;
        }
        try {
          if (cameraStream) {
            cameraStream.getTracks().forEach((track) => track.stop());
          }
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: cameraFacingMode },
            audio: false,
          });
          cameraPreview.srcObject = cameraStream;
        } catch (err) {
          if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
            showCameraError("Camera permission is required to use Camera mode.");
          } else if (err.name === "NotFoundError" || err.name === "DevicesNotFoundError") {
            showCameraError("No camera found on this device.");
          } else if (err.name === "OverconstrainedError") {
            cameraFacingMode = cameraFacingMode === "environment" ? "user" : "environment";
            return openCamera();
          } else {
            showCameraError("Could not access the camera: " + err.message);
          }
        }
      }

      cameraFlipBtn.addEventListener("click", () => {
        cameraFacingMode = cameraFacingMode === "environment" ? "user" : "environment";
        openCamera();
      });

      function closeCamera() {
        if (cameraStream) {
          cameraStream.getTracks().forEach((track) => track.stop());
          cameraStream = null;
        }
        cameraPreview.srcObject = null;
      }

      function showCameraError(msg) {
        cameraPreview.classList.add("hidden");
        cameraErrorEl.textContent = msg;
        cameraErrorEl.classList.remove("hidden");
      }

      function captureFrame() {
        if (!cameraStream || !cameraPreview.videoWidth) return null;
        const vw = cameraPreview.videoWidth;
        const vh = cameraPreview.videoHeight;
        let tw = vw;
        let th = vh;
        if (tw > CAMERA_MAX_DIMENSION || th > CAMERA_MAX_DIMENSION) {
          const scale = CAMERA_MAX_DIMENSION / Math.max(tw, th);
          tw = Math.round(tw * scale);
          th = Math.round(th * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = tw;
        canvas.height = th;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(cameraPreview, 0, 0, tw, th);
        return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", CAMERA_JPEG_QUALITY));
      }

      // ─── Camera send ───

      cameraInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !sendCameraBtn.disabled) sendCameraMessage();
      });
      sendCameraBtn.addEventListener("click", sendCameraMessage);

      async function sendCameraMessage() {
        const text = cameraInput.value.trim();
        if (!text || cameraAnalyzing) return;

        const blob = await captureFrame();
        if (!blob) {
          setStatus("Couldn\u2019t capture the current frame. Please try again.");
          return;
        }

        cameraInput.value = "";
        showCameraUser(text);
        showCameraThinking();
        cameraAnalyzing = true;
        sendCameraBtn.disabled = true;
        cameraInput.disabled = true;

        try {
          const form = new FormData();
          form.append("image", blob, "frame.jpg");
          form.append("query", text);
          const response = await fetch("/api/vision/query", { method: "POST", body: form });
          const data = await response.json();
          removeCameraThinking();
          if (!response.ok) {
            setStatus((data.error?.code || "error") + ": " + (data.error?.message || response.statusText));
          } else {
            appendCameraAssistant(data.answer);
          }
        } catch (err) {
          removeCameraThinking();
          setStatus("error: " + err.message);
        } finally {
          cameraAnalyzing = false;
          sendCameraBtn.disabled = false;
          cameraInput.disabled = false;
          cameraInput.focus();
        }
      }

      // ─── Camera chat log ───

      let cameraAssistantEl = null;

      function showCameraUser(text) {
        const el = document.createElement("div");
        el.className = "bubble user";
        el.textContent = text;
        cameraLogEl.append(el);
        cameraAssistantEl = null;
        cameraLogEl.scrollTop = cameraLogEl.scrollHeight;
      }

      function appendCameraAssistant(text) {
        if (!cameraAssistantEl) {
          cameraAssistantEl = document.createElement("div");
          cameraAssistantEl.className = "bubble assistant";
          cameraLogEl.append(cameraAssistantEl);
        }
        cameraAssistantEl.textContent += text;
        cameraLogEl.scrollTop = cameraLogEl.scrollHeight;
      }

      function showCameraThinking() {
        removeCameraThinking();
        const el = document.createElement("div");
        el.className = "thinking-bubble";
        el.id = "cameraThinking";
        el.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
        cameraLogEl.append(el);
        cameraLogEl.scrollTop = cameraLogEl.scrollHeight;
      }

      function removeCameraThinking() {
        document.querySelector("#cameraThinking")?.remove();
      }
    </script>
  </body>
</html>
